<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Form</title>
    <link rel="stylesheet" href="./css/input.css" />
    <link rel="shortcut icon" href="./img/fav.png" type="image/x-icon" />
  </head>
  <body class="transition-colors duration-500">
    <header class="bg-blue-500 relative py-3 sm:py-0">
      <div class="container w-3/4 mx-auto flex justify-between items-center">
        <a class="flex text-white font-semibold">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="mr-1 text-white size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"
            />
          </svg>
          Secure Area
        </a>
        <nav class="">
          <button id="menu_btn" class="cursor-pointer sm:hidden">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 text-white"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
              />
            </svg>
          </button>
          <ul
            class="text-white font-semibold text-sm bg-blue-500 absolute w-full left-0 top-10 p-5 text-center hidden sm:flex sm:relative
            sm:top-0 items-center rounded"
            id="menu"
          >
            <li class="mb-2 sm:mb-0 hover:text-blue-950 sm:mr-3"><a href="">Home</a></li>
            <li class="mb-2 sm:mb-0 hover:text-blue-950 sm:mr-3"><a href="">Contact</a></li>
            <li class="mb-2 sm:mb-0 hover:text-blue-950 sm:mr-3"><a href="">Login</a></li>
            <li class="mb-2 sm:mb-0
            bg-blue-950 
            py-2
            px-2
            "><a href="">Sign in</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <section
      class="mx-auto flex flex-col sm:flex-row justify-center items-center bg-blue-200 h-[91vh] sm:px-60 sm:h-[88vh]"
    >
      <div class="order-1 sm:order-2 w-1/2">
        <img class="w-60 sm:w-80" src="./img/undraw_login_weas.svg" />
      </div>
      <div class="order-2 sm:order-1 h-1/2 bg-white p-5 w-3/4 sm:w-1/2 mt-5 rounded">
        <h3 class="text-3xl font-semibold text-center">Welcome Back</h3>
        <p class="text-sm text-center text-gray-500 mb-3">
          Please enter your details
        </p>
        <form>
          <label class="block font-semibold" for="email">Email Address</label>
          <input
            class="border-gray-600 px-2 py-1 mb-1 w-full"
            type="email"
            id="email"
            placeholder="Enter your Email"
          />

          <label class="block font-semibold" for="password">Password</label>
          <input
            class="px-2 py-1 w-full mb-2"
            type="password"
            id="password"
            placeholder="Enter your Password"
          />
          <input
            class="rounded py-1 block text-md hover:bg-black bg-blue-950 text-white w-full font-semibold cursor-pointer"
            type="submit"
            value="Sign in"
          />
        </form>
        <p class="
            text-center
            text-sm
            mt-1
            text-gray-700
        ">Don't have an account? <a href="#" class="text-blue-700 underline">Sign up</a></p>
      </div>
    </section>
    <script type="module" src="scripts.js"></script>
  </body>
</html>
